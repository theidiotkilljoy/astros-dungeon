<!doctype html>
<!--
  Astro's Dungeon — product data table

  Edit ONLY the <tbody> rows.
  The site reads this file and renders product cards automatically.

  Columns:
    1) category    : apparel | accessories | stickers | other
    2) title       : what you want displayed on the card
    3) share_url   : your Share & Save listing link (use https://astrosdungeon.etsy.com/listing/<id>/<slug>)
    4) price       : 20.00 (or $20.00)
    5) sale_price  : leave blank if not on sale; otherwise 15.00 (or $15.00)
    6) images      : comma-separated image URLs/paths (first one is the card thumbnail)
    7) description : optional; leave blank to hide

  Notes:
    • Images can be Etsy CDN links (i.etsystatic.com) OR local paths like images/products/myitem/1.png
    • If you leave images blank, the site will try images/products/<slug>/1.png and then fall back to images/logo.png
-->
<table id="listings" aria-hidden="true" style="display:none">
  <thead>
    <tr>
      <th>category</th>
      <th>title</th>
      <th>share_url</th>
      <th>price</th>
      <th>sale_price</th>
      <th>images</th>
      <th>description</th>
    </tr>
  </thead>

  <tbody>
